<!doctype html><html><body style="margin:0">
<iframe id="f" src="index.html" style="width:1440px;height:2200px;border:0"></iframe>
<script>
document.getElementById('f').addEventListener('load',function(){
  var d=this.contentDocument;
  setTimeout(function(){
    var b=d.querySelector('[data-project="portraits"]');
    if(b) b.click();
    setTimeout(function(){ window.scrollTo(0,0); },300);
  },600);
});
</script></body></html>
